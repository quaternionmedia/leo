version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: .github/workflows
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    labels:
      - "⬆️ dependencies"

  # NPM
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    labels:
      - "⬆️ dependencies"
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Python (pip via pyproject.toml)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    labels:
      - "⬆️ dependencies"
    groups:
      python-dependencies:
        update-types:
          - minor
          - patch
