[project]
name = "leo"
version = "0.1.0"
description = "A virtual conducting webapp"
authors = [
    {name = "Quaternion Media",email = "leo@quaternion.media"},
]
dependencies = [
    "fastapi>=0.103.1",
    "pymongo>=4.5.0",
    "pyRealParser>=0.1.0",
    "aiofiles>=23.2.1",
    "click>=8.1.7",
    "uvicorn>=0.23.2",
    "colorama>=0.4.6; sys_platform == 'win32'",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
leo = "leo.cli:cli"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: marks tests as end-to-end (may be slow, requires npm/node)",
]
